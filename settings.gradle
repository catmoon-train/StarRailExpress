pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

include 'sre-native'
include 'sre-pack-compat'
include 'sre-performance'
include 'sre-pokemon-compat'
include 'sre-server-optimizer'
include 'sre-startup'
project(':sre-native').projectDir = file('../sre-native')
project(':sre-pack-compat').projectDir = file('../sre-pack-compat')
project(':sre-performance').projectDir = file('../sre-performance')
project(':sre-pokemon-compat').projectDir = file('../sre-pokemon-compat')
project(':sre-server-optimizer').projectDir = file('../sre-server-optimizer')
project(':sre-startup').projectDir = file('../sre-startup')
include 'cy-dungeon'
project(':cy-dungeon').projectDir = file('../cy-dungeon')
