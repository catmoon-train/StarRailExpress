pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

// 这些兄弟仓库是可选的：Gradle 9 起 include 不存在的目录会在配置阶段直接失败，
// 因此只在实际检出时才纳入构建。
[
        'sre-native'           : '../sre-native',
        'sre-pack-compat'      : '../sre-pack-compat',
        'sre-performance'      : '../sre-performance',
        'sre-pokemon-compat'   : '../sre-pokemon-compat',
        'sre-server-optimizer' : '../sre-server-optimizer',
        'sre-startup'          : '../sre-startup',
        'cy-dungeon'           : '../cy-dungeon',
].each { name, path ->
    def moduleDir = file(path)
    if (moduleDir.isDirectory()) {
        include name
        project(":${name}").projectDir = moduleDir
    }
}
