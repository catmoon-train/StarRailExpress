plugins {
    id 'fabric-loom'
}

version = '1.0.0'
group = 'io.wifi'
base { archivesName = 'sre-pack-compat' }

repositories.addAll(rootProject.repositories)

loom {
    accessWidenerPath = file('src/main/resources/sre-pack-compat.accesswidener')
    // 兼容包由主客户端加载，不单独创建可启动的客户端运行配置。
    runs {
        remove(getByName('client'))
    }
}

// Loom 保留已移除配置的禁用任务；清掉独立启动准备，避免裸 runClient 连带处理它。
tasks.named('runClient') {
    enabled = false
    setDependsOn([])
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // 复用根项目已有版本，仅编译可选配置入口，不嵌入 Mod Menu。
    modCompileOnly "maven.modrinth:modmenu:11.0.3"
    // 与核心相同的可选 Sodium 0.8 配置 API；不内嵌、不增加运行时硬依赖。
    modCompileOnly "maven.modrinth:sodium:${rootProject.sodium_version}-fabric"
    // 复用核心已有映射依赖；调用接口同时核对用户提供的 2.6.27，不内嵌语音模组。
    modCompileOnly "maven.modrinth:simple-voice-chat:fabric-${rootProject.voicechat_version}"
    include(implementation(annotationProcessor('com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1')))
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
java { withSourcesJar() }
