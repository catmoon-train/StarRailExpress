plugins { id 'fabric-loom' }

version = '1.0.0'
group = 'io.wifi'
base { archivesName = 'sre-pokemon-compat' }
repositories.addAll(rootProject.repositories)

loom {
    runs { remove(getByName('client')) }
}
tasks.named('runClient') { enabled = false; setDependsOn([]) }

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    include(implementation(annotationProcessor('com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1')))
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (project.hasProperty('journeymapJar')) systemProperty 'sre.journeymap.jar', project.property('journeymapJar')
    if (project.hasProperty('megaJar')) systemProperty 'sre.mega.jar', project.property('megaJar')
    if (project.hasProperty('aotakeJar')) systemProperty 'sre.aotake.jar', project.property('aotakeJar')
    if (project.hasProperty('cobblemonJar')) systemProperty 'sre.cobblemon.jar', project.property('cobblemonJar')
}
java { withSourcesJar() }
